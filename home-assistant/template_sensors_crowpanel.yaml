- sensor:
    - name: "Zuzenhausen Abfahrten ESPHome"
      unique_id: zuzenhausen_abfahrten_esphome
      state: >
        {% set deps = state_attr('sensor.zuzenhausen_departures', 'next_departures') %}
        {% if deps %}
          {% set ns = namespace(result=[]) %}
          {% for dep in (deps[:2]) %}
            {% set ns.result = ns.result + [{
              'departure_current': dep.departure_current | default('--'),
              'delay': dep.delay | default(0),
              'richtung': (dep.destination | default('--')).split(',')[0]
            }] %}
          {% endfor %}
          {{ ns.result | tojson }}
        {% else %}
          []
        {% endif %}

# ─────────────────────────────────────────────────────────────────────────────
# Täglicher Hausverbrauch — what the house actually used today, in kWh.
#
# The Fronius smart meter only counts what crosses the grid connection point.
# `sensor.taglicher_stromvebrauch` is a daily utility_meter over "Bezogene
# Wirkenergie", so despite its name it is grid *import*: on a sunny day it reads
# near zero while the house runs happily off the roof. The house total is
# therefore an identity, not a reading:
#
#     Verbrauch = (PV − Einspeisung) + Netzbezug
#                  ^^^^^^^^^^^^^^^^    ^^^^^^^^^
#                  covered itself      bought
#
# Battery. The BYD lives inside the "covered itself" term and this identity
# cannot see it: PV that charges the battery counts as consumed the moment it
# leaves the roof, and comes back as a discount when the battery discharges
# later. Across a full day that mostly cancels — the error is whatever the SOC
# moved between midnights — but mid-morning the figure runs high.
#
# Units. All three sources are utility_meter helpers, and a utility_meter
# inherits the unit of whatever it meters. The Fronius meters are not all in the
# same one (the monthly grid sensor is in Wh), so each term is normalised to kWh
# from its own `unit_of_measurement` rather than assumed — the same defence
# sql_sensors_crowpanel.yaml uses on the statistics table.
# ─────────────────────────────────────────────────────────────────────────────
- sensor:
    - name: "Täglicher Hausverbrauch"
      unique_id: taglicher_hausverbrauch
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:home-lightning-bolt
      # A missing term does not look missing — it just understates the total,
      # which reads like a real number. Going unavailable instead lets the panel
      # hold its last value rather than draw a plausible lie.
      availability: >
        {{ has_value('sensor.tagliche_pv_produktion')
           and has_value('sensor.taglich_eingespeist')
           and has_value('sensor.taglicher_stromvebrauch') }}
      state: >
        {% set ns = namespace(kwh = 0.0) %}
        {% for entity, sign in [
             ('sensor.tagliche_pv_produktion',   1),
             ('sensor.taglich_eingespeist',     -1),
             ('sensor.taglicher_stromvebrauch',  1)] %}
          {% set unit = state_attr(entity, 'unit_of_measurement') %}
          {% set scale = 0.001 if unit == 'Wh' else (1000.0 if unit == 'MWh' else 1.0) %}
          {% set ns.kwh = ns.kwh + sign * (states(entity) | float(0)) * scale %}
        {% endfor %}
        {# The three meters do not reset in the same instant at midnight, so for
           a moment the sum can go negative. Clamped, because `total_increasing`
           would read a negative as a meter reset. #}
        {{ [ns.kwh, 0.0] | max | round(2) }}
