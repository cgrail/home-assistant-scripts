# ─────────────────────────────────────────────────────────────────────────────
# Monthly energy history for the CrowPanel history card.
#
# This file is the *value* of the `sql:` key, not a complete config block —
# include it from configuration.yaml alongside template_sensors_crowpanel.yaml:
#
#     sql: !include home-assistant/sql_sensors_crowpanel.yaml
#
# so it must start at the list, with no `sql:` of its own; otherwise the key
# ends up nested inside itself. Same idea as the train sensor: Home Assistant
# serialises an array into one state string and the ESPHome device parses it
# inline with a C++ lambda.
#
# State format — **always exactly 12 entries**, oldest month first, whole kWh:
#
#     "412/180,530/150,610/120,...,388/95"
#      ^^^      ^^^
#      selbst gedeckt (PV minus Einspeisung)
#               Netzbezug
#
# ~120 characters, comfortably inside Home Assistant's 255-character state
# limit. That limit is why the values are rounded to integers and why the month
# names are not transmitted — the panel derives those from its own clock, with
# the last entry being the current month.
#
# The twelve slots are generated first and the meter data is joined *onto* them,
# which is the whole point of the `slots` CTE. Grouping the meters and hoping
# for twelve rows does not survive contact with reality: a month in which any
# one of the three meters has no statistics — a meter added later, an
# integration reloaded under a new entity id, a gap in the recorder — produced a
# NULL, `group_concat` dropped it, and the panel silently showed a shorter
# series. That is what turned a rolling twelve months into "this year so far".
# Now such a month arrives as "0/0": an empty slot in a full twelve-month axis,
# which reads as missing data instead of as a different window.
#
# Reads the `statistics` table: hourly long-term statistics, which the recorder
# keeps forever. Not `statistics_short_term`, which is purged.
# ─────────────────────────────────────────────────────────────────────────────

- name: "Crowpanel Energie Historie"
  unique_id: crowpanel_energie_historie
  # No polling interval here — see the note on polling below. There is no knob
  # for it in this schema; adding one is a config error, not a slower sensor.
  column: "hist"
  value_template: "{{ value if value else '' }}"
  query: >-
    WITH RECURSIVE
    slots(n, ym) AS (
      SELECT 0, strftime('%Y-%m', 'now', 'localtime', 'start of month', '-11 months')
      UNION ALL
      SELECT n + 1,
             strftime('%Y-%m', 'now', 'localtime', 'start of month',
                      printf('%+d months', n - 10))
      FROM slots
      WHERE n < 11
    ),
    mon AS (
      SELECT
        sm.statistic_id AS sid,
        strftime('%Y-%m', s.start_ts, 'unixepoch', 'localtime') AS ym,
        (MAX(s.sum) - MIN(s.sum)) *
          CASE sm.unit_of_measurement
            WHEN 'Wh'  THEN 0.001
            WHEN 'MWh' THEN 1000.0
            ELSE 1.0
          END AS kwh
      FROM statistics s
      JOIN statistics_meta sm ON sm.id = s.metadata_id
      WHERE sm.statistic_id IN (
              'sensor.fronius_total_energy',
              'sensor.smart_meter_ts_5ka_3_real_energy_produced',
              'sensor.smart_meter_ts_5ka_3_real_energy_consumed')
        AND s.start_ts >= strftime('%s', date('now', 'localtime', 'start of month', '-11 months'))
      GROUP BY sid, ym
    ),
    agg AS (
      SELECT
        ym,
        MAX(CASE WHEN sid = 'sensor.fronius_total_energy' THEN kwh END) AS pv_kwh,
        MAX(CASE WHEN sid = 'sensor.smart_meter_ts_5ka_3_real_energy_produced' THEN kwh END) AS out_kwh,
        MAX(CASE WHEN sid = 'sensor.smart_meter_ts_5ka_3_real_energy_consumed' THEN kwh END) AS in_kwh
      FROM mon
      GROUP BY ym
    )
    SELECT group_concat(v, ',') AS hist FROM (
      SELECT
        slots.n,
        CAST(ROUND(MAX(0, COALESCE(agg.pv_kwh, 0) - COALESCE(agg.out_kwh, 0))) AS INT)
        || '/' ||
        CAST(ROUND(COALESCE(agg.in_kwh, 0)) AS INT) AS v
      FROM slots
      LEFT JOIN agg ON agg.ym = slots.ym
      ORDER BY slots.n
    );

# ── Notes on the query ───────────────────────────────────────────────────────
#
# The slot walk. `slots` counts n = 0…11 and turns each into a '%Y-%m' string,
# so the join key is a month name rather than an offset and month lengths never
# enter into it. The step modifier is built with `printf('%+d months', n - 10)`
# because the *next* row is n+1 and therefore 11-(n+1) = 10-n months back —
# which reaches '+0 months' on the last row, a form SQLite accepts.
#
# Polling. `scan_interval` is not part of the SQL integration's schema. Home
# Assistant rejects it outright — "'scan_interval' is an invalid option for
# 'sql'" — so it is not a matter of taste: the key cannot be here at all. The
# query therefore runs on the integration's own fixed interval, which is far
# more often than the underlying data moves (long-term statistics gain a row
# once an hour). If the table scan ever shows up in the recorder's timings,
# turn polling off in the entity's own settings (Settings → Devices &
# Services → Entities → this entity → Advanced → Enable polling for updates)
# and drive it from an automation calling `homeassistant.update_entity` on a
# slow trigger, rather than looking for a knob in this file.
#
# Units. `statistics.sum` is stored in whatever unit the statistic itself uses,
# which is not the same for all three meters. The CASE on
# `statistics_meta.unit_of_measurement` normalises everything to kWh, so the
# query stays correct even if one of the meters is recorded in Wh.
#
# Month totals. `MAX(sum) - MIN(sum)` misses whatever accumulated inside the
# month's *first* hour, because the first row of the month already carries that
# hour's increment. The error is under one hour of energy on a monthly total —
# invisible at 60 px of bar height, and not worth a boundary lookup for a wall
# display.
#
# Time zones. `strftime('%s', date(...))` reads a local date back as if it were
# UTC, so the lower bound sits the UTC offset past local midnight and the oldest
# month loses its first hour or two. Harmless here, and the fixed slot list also
# makes the opposite error harmless: rows that spill into a thirteenth `ym` just
# find no slot to join to and are dropped.
#
# Ordering. SQLite honours the inner ORDER BY when feeding group_concat. On
# SQLite 3.44+ this can be stated outright as
# `group_concat(v, ',' ORDER BY n)`; the subquery form above also works on
# older versions, which is why it is written this way.
#
# Schema. `start_ts` (REAL, epoch seconds) is the column on Home Assistant
# 2023.4 and newer. On an older schema the column is `start`, a DATETIME, and
# the two date expressions become:
#
#     strftime('%Y-%m', s.start, 'localtime')
#     AND s.start >= datetime('now', 'localtime', 'start of month', '-11 months')
