# ─────────────────────────────────────────────────────────────────────────────
# Live panel — energy flow diagram
#
# Layout (panel local coordinates, 375 x 320):
#   y   6 …  52   header row: PV | Einspeisung | Netzbezug (icon + value)
#   y 108 … 188   Akku arc | Haus node | "ohne WP" card
#   y 228 … 312   Buzz arc | Wärmepumpe card | Warmwasser card
#
# Every connection is built from two kinds of widgets:
#   line_<flow>    the wire, in a heavily dimmed version of the flow colour
#   dot_<flow>_Nx  the comets: a glowing head (a) with two shrinking tail
#                  dots (b, c) that travel along the wire and show the
#                  direction of the flow
#
# The sensors only normalise their value to kW and store it in a global.
# Visibility, wire width and comet speed are derived centrally in the 50 ms
# interval below, so a flow is never inconsistent with the numbers next to it.
# ─────────────────────────────────────────────────────────────────────────────

globals:
  # Raw power values, all normalised to kW.
  - id: pv_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: export_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: import_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: batt_kw          # positive = charging, negative = discharging
    type: float
    restore_value: false
    initial_value: '0'
  - id: house_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: wp_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: buzz_kw
    type: float
    restore_value: false
    initial_value: '0'

sensor:
  - platform: homeassistant
    id: pv
    entity_id: sensor.solarnet_power_photovoltaics
    on_value:
      - lambda: 'id(pv_kw) = isnan(x) ? 0.0f : x / 1000.0f;'
      - lvgl.label.update:
          id: val_pv
          text:
            format: "%.1f kW"
            args: ['id(pv_kw)']

  - platform: homeassistant
    id: pv_eingespeist
    entity_id: sensor.solarnet_power_grid_export
    on_value:
      - lambda: 'id(export_kw) = isnan(x) ? 0.0f : x / 1000.0f;'
      - lvgl.label.update:
          id: val_eingespeist
          text:
            format: "%.1f kW"
            args: ['id(export_kw)']

  - platform: homeassistant
    id: netzbezug
    entity_id: sensor.solarnet_power_grid_import
    on_value:
      - lambda: 'id(import_kw) = isnan(x) ? 0.0f : x / 1000.0f;'
      - lvgl.label.update:
          id: val_netz
          text:
            format: "%.1f kW"
            args: ['id(import_kw)']

  - platform: homeassistant
    id: batterie_ladeleistung
    entity_id: sensor.batterie_ladeleistung_entladeleistung
    on_value:
      - lambda: 'id(batt_kw) = isnan(x) ? 0.0f : x / 1000.0f;'

  - platform: homeassistant
    id: gesamt_stromverbrauch
    entity_id: sensor.gesamt_stromverbrauch_in_kwh
    on_value:
      - lambda: 'id(house_kw) = isnan(x) ? 0.0f : x;'
      - lvgl.label.update:
          id: val_gesamt
          text:
            format: "%.1f kW"
            args: ['id(house_kw)']

  - platform: homeassistant
    id: wp
    entity_id: sensor.strom_warmpumpe_in_kwh
    on_value:
      - lambda: 'id(wp_kw) = isnan(x) ? 0.0f : x;'
      - lvgl.label.update:
          id: val_wp
          text:
            format: "%.1f kW"
            args: ['id(wp_kw)']

  - platform: homeassistant
    id: wattpilot_charging_power
    entity_id: sensor.wattpilot_charging_power
    on_value:
      - lambda: 'id(buzz_kw) = isnan(x) ? 0.0f : x / 1000.0f;'

  # ── Values that are only displayed ───────────────────────────
  - platform: homeassistant
    id: hausverbrauch_ohne_wp
    entity_id: sensor.hausverbrauch_ohne_wp
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: val_hauswp
                text:
                  format: "%.1f kW"
                  args: [x]

  - platform: homeassistant
    id: byd_battery_box_premium_hv_state_of_charge
    entity_id: sensor.byd_battery_box_premium_hv_state_of_charge
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: val_akku
                text:
                  format: "%.0f%%"
                  args: [x]
            - lvgl.arc.update:
                id: arc_akku
                value: !lambda 'return x;'
          else:
            - lvgl.label.update:
                id: val_akku
                text: "-- %"
            - lvgl.arc.update:
                id: arc_akku
                value: 0

  - platform: homeassistant
    id: buzz_battery_level
    entity_id: sensor.buzz_battery_level
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: val_buzz
                text:
                  format: "%.0f%%"
                  args: [x]
            - lvgl.arc.update:
                id: arc_buzz
                value: !lambda 'return x;'
          else:
            - lvgl.label.update:
                id: val_buzz
                text: "-- %"
            - lvgl.arc.update:
                id: arc_buzz
                value: 0

  - platform: homeassistant
    id: tagliche_wp_heizzyklen
    entity_id: sensor.tagliche_wp_heizzyklen
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: val_wp_zyklen
                text:
                  format: "%.0f Starts"
                  args: [x]

  - platform: homeassistant
    id: wp_ruecklauf
    entity_id: sensor.luxtronik_350107_0371_flow_out_temperature
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: val_wp_ruecklauf
                text:
                  format: "Rück: %.1f °C"
                  args: [x]

  - platform: homeassistant
    id: ww_temperatur
    entity_id: sensor.hybrox_11_grail_dhw
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: val_wasser
                text:
                  format: "%.1f °C"
                  args: [x]

interval:
  # 20 fps animation of the energy flows.
  - interval: 50ms
    then:
      - lambda: |-
          // Split the raw meter readings into the seven directed flows (kW).
          const float batt_charge = std::max(0.0f, id(batt_kw));
          const float batt_supply = std::max(0.0f, -id(batt_kw));
          const float pv_direct = std::max(0.0f, id(pv_kw) - id(export_kw) - batt_charge);
          const float flow_kw[7] = {
            batt_charge,     // 0  PV -> Akku
            id(export_kw),   // 1  PV -> Einspeisung
            pv_direct,       // 2  PV -> Haus
            id(import_kw),   // 3  Netz -> Haus
            batt_supply,     // 4  Akku -> Haus
            id(wp_kw),       // 5  Haus -> Wärmepumpe
            id(buzz_kw),     // 6  Haus -> Buzz
          };
          // Wire start, wire end and the number of comets on the wire.
          static const struct { int16_t x0, y0, x1, y1; uint8_t comets; } PATH[7] = {
            { 48,  54,  48, 104, 1},
            {102,  18, 128,  18, 1},
            { 96,  54, 147, 104, 2},
            {309,  54, 228, 104, 2},
            { 92, 148, 126, 148, 1},
            {187, 186, 187, 224, 1},
            {150, 186,  88, 226, 2},
          };
          // Distance behind the comet head, brightness and radius of the
          // three dots that make up one comet.
          static const float TAIL_PX[3] = {0.0f, 7.0f, 12.0f};
          static const float TAIL_OPA[3] = {1.0f, 0.55f, 0.30f};
          static const int TAIL_HALF[3] = {5, 4, 3};

          lv_obj_t *wire[7] = {
            id(line_pv_akku)->obj,
            id(line_pv_einspeisung)->obj,
            id(line_pv_haus)->obj,
            id(line_netz_haus)->obj,
            id(line_akku_haus)->obj,
            id(line_haus_wp)->obj,
            id(line_haus_buzz)->obj,
          };
          lv_obj_t *comet[7][2][3] = {
            {{id(dot_pv_akku_0a),   id(dot_pv_akku_0b),   id(dot_pv_akku_0c)},   {}},
            {{id(dot_pv_einsp_0a),  id(dot_pv_einsp_0b),  id(dot_pv_einsp_0c)},  {}},
            {{id(dot_pv_haus_0a),   id(dot_pv_haus_0b),   id(dot_pv_haus_0c)},
             {id(dot_pv_haus_1a),   id(dot_pv_haus_1b),   id(dot_pv_haus_1c)}},
            {{id(dot_netz_haus_0a), id(dot_netz_haus_0b), id(dot_netz_haus_0c)},
             {id(dot_netz_haus_1a), id(dot_netz_haus_1b), id(dot_netz_haus_1c)}},
            {{id(dot_akku_haus_0a), id(dot_akku_haus_0b), id(dot_akku_haus_0c)}, {}},
            {{id(dot_haus_wp_0a),   id(dot_haus_wp_0b),   id(dot_haus_wp_0c)},   {}},
            {{id(dot_haus_buzz_0a), id(dot_haus_buzz_0b), id(dot_haus_buzz_0c)},
             {id(dot_haus_buzz_1a), id(dot_haus_buzz_1b), id(dot_haus_buzz_1c)}},
          };
          const lv_style_selector_t sel = (lv_style_selector_t) LV_PART_MAIN | (lv_style_selector_t) LV_STATE_DEFAULT;
          // Animation position (0…1) of the comets on each wire, and the wire
          // width that is currently applied.
          static float flow_phase[7] = {};
          static int last_width[7] = {};

          for (int f = 0; f < 7; f++) {
            const bool active = flow_kw[f] > 0.05f;
            // Only touch the hidden flag when the state actually changes.
            if (active == lv_obj_has_flag(wire[f], LV_OBJ_FLAG_HIDDEN)) {
              if (active) {
                lv_obj_clear_flag(wire[f], LV_OBJ_FLAG_HIDDEN);
              } else {
                lv_obj_add_flag(wire[f], LV_OBJ_FLAG_HIDDEN);
                for (int c = 0; c < PATH[f].comets; c++)
                  for (int k = 0; k < 3; k++)
                    lv_obj_add_flag(comet[f][c][k], LV_OBJ_FLAG_HIDDEN);
              }
            }
            if (!active)
              continue;

            // 2 px wire at idle, 4 px from 4 kW upwards.
            const int width = 2 + (int) (std::min(flow_kw[f], 4.0f) / 2.0f + 0.5f);
            if (width != last_width[f]) {
              lv_obj_set_style_line_width(wire[f], width, sel);
              last_width[f] = width;
            }

            const float dx = PATH[f].x1 - PATH[f].x0;
            const float dy = PATH[f].y1 - PATH[f].y0;
            const float len = sqrtf(dx * dx + dy * dy);
            // Comets crawl at 16 px/s and speed up to ~86 px/s at 5 kW.
            const float speed = 16.0f + 14.0f * std::min(flow_kw[f], 5.0f);
            float phase = flow_phase[f] + speed * 0.05f / len;
            if (phase >= 1.0f)
              phase -= 1.0f;
            flow_phase[f] = phase;

            for (int c = 0; c < PATH[f].comets; c++) {
              float base = phase + (float) c / PATH[f].comets;
              if (base >= 1.0f)
                base -= 1.0f;
              // Fade the whole comet in at the source and out at the destination.
              const float fade = base < 0.12f ? base / 0.12f
                                              : (base > 0.85f ? (1.0f - base) / 0.15f : 1.0f);
              for (int k = 0; k < 3; k++) {
                lv_obj_t *d = comet[f][c][k];
                const float t = base - TAIL_PX[k] / len;
                if (t < 0.0f) {  // tail dot has not left the source yet
                  if (!lv_obj_has_flag(d, LV_OBJ_FLAG_HIDDEN))
                    lv_obj_add_flag(d, LV_OBJ_FLAG_HIDDEN);
                  continue;
                }
                lv_obj_set_pos(d, (int) (PATH[f].x0 + dx * t + 0.5f) - TAIL_HALF[k],
                                  (int) (PATH[f].y0 + dy * t + 0.5f) - TAIL_HALF[k]);
                lv_obj_set_style_bg_opa(d, (lv_opa_t) (255.0f * fade * TAIL_OPA[k]), sel);
                if (k == 0)
                  lv_obj_set_style_shadow_opa(d, (lv_opa_t) (170.0f * fade), sel);
                if (lv_obj_has_flag(d, LV_OBJ_FLAG_HIDDEN))
                  lv_obj_clear_flag(d, LV_OBJ_FLAG_HIDDEN);
              }
            }
          }

font:
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_20
    size: 20
    glyphs:
      - "\U000F0A72"  # solar-power
      - "\U000F192C"  # transmission-tower-export
      - "\U000F192D"  # transmission-tower-import
      - "\U000F02DC"  # home

lvgl:
  # Shared look of the comet dots: one style per position in the comet and
  # one per flow colour, combined per widget via "styles:".
  style_definitions:
    - id: comet_head
      radius: 20
      border_width: 0
      shadow_width: 16
      shadow_spread: 0
    - id: comet_tail
      radius: 20
      border_width: 0
      shadow_width: 0
    - id: comet_pv
      bg_color: 0xFBBF24
      shadow_color: 0xF59E0B
    - id: comet_export
      bg_color: 0x4ADE80
      shadow_color: 0x22C55E
    - id: comet_grid
      bg_color: 0xF87171
      shadow_color: 0xEF4444
    - id: comet_akku
      bg_color: 0x22D3EE
      shadow_color: 0x06B6D4
    - id: comet_wp
      bg_color: 0xFB923C
      shadow_color: 0xF97316
    - id: comet_buzz
      bg_color: 0xA78BFA
      shadow_color: 0x8B5CF6

  widgets:
    # ── TOP RIGHT: Live ──────────────────────────────────────
    - obj:
        x: 405
        y: 80
        width: 375
        height: 320
        bg_color: 0x151F32
        radius: 12
        border_width: 1
        border_color: 0x1E293B
        pad_all: 0
        scrollable: false
        widgets:
          # ── Header row ───────────────────────────────────────
          - label:
              x: 31
              y: 8
              text: "\U000F0A72"
              text_font: mdi_20
              text_color: 0xFBBF24
          - label:
              x: 55
              y: 11
              text: "PV"
              text_font: montserrat_14_de
              text_color: 0xFBBF24
          - label:
              id: val_pv
              x: 8
              y: 27
              width: 92
              text_align: center
              text: "0.0 kW"
              text_font: montserrat_20_de
              text_color: 0xF8FAFC
          - label:
              x: 133
              y: 8
              text: "\U000F192C"
              text_font: mdi_20
              text_color: 0x4ADE80
          - label:
              x: 157
              y: 11
              text: "Einspeisung"
              text_font: montserrat_14_de
              text_color: 0x4ADE80
          - label:
              id: val_eingespeist
              x: 135
              y: 27
              width: 110
              text_align: center
              text: "0.0 kW"
              text_font: montserrat_20_de
              text_color: 0xF8FAFC
          - label:
              x: 258
              y: 8
              text: "\U000F192D"
              text_font: mdi_20
              text_color: 0xF87171
          - label:
              x: 284
              y: 11
              text: "Netzbezug"
              text_font: montserrat_14_de
              text_color: 0xF87171
          - label:
              id: val_netz
              x: 253
              y: 27
              width: 112
              text_align: center
              text: "0.0 kW"
              text_font: montserrat_20_de
              text_color: 0xF8FAFC

          # ── Haus node ────────────────────────────────────────
          # Drawn first so the neighbouring cards clip its glow, not the
          # other way round.
          - obj:
              x: 130
              y: 108
              width: 115
              height: 76
              radius: 14
              bg_color: 0x102B45
              border_width: 2
              border_color: 0x38BDF8
              shadow_color: 0x38BDF8
              shadow_width: 14
              shadow_opa: 35%
              pad_all: 0
              scrollable: false
          - label:
              x: 130
              y: 113
              width: 115
              text_align: center
              text: "\U000F02DC"
              text_font: mdi_20
              text_color: 0x38BDF8
          - label:
              x: 130
              y: 135
              width: 115
              text_align: center
              text: "Haus Gesamt"
              text_font: montserrat_14_de
              text_color: 0x38BDF8
          - label:
              id: val_gesamt
              x: 130
              y: 152
              width: 115
              text_align: center
              text: "0.0 kW"
              text_font: montserrat_20_de
              text_color: 0xF8FAFC

          # ── Akku arc ─────────────────────────────────────────
          - arc:
              id: arc_akku
              x: 8
              y: 108
              width: 80
              height: 80
              value: 0
              min_value: 0
              max_value: 100
              arc_color: 0x1E293B
              arc_width: 12
              indicator:
                arc_color: 0x22D3EE
                arc_width: 12
          - label:
              id: val_akku
              x: 8
              y: 132
              width: 80
              text_align: center
              text: "-- %"
              text_font: montserrat_14_de
              text_color: 0xF8FAFC
          - label:
              x: 8
              y: 148
              width: 80
              text_align: center
              text: "Akku"
              text_font: montserrat_14_de
              text_color: 0x94A3B8

          # ── "ohne WP" card ───────────────────────────────────
          - obj:
              x: 253
              y: 108
              width: 112
              height: 76
              radius: 10
              bg_color: 0x101A2C
              border_width: 1
              border_color: 0x22304A
              pad_all: 0
              scrollable: false
          - label:
              x: 253
              y: 126
              width: 112
              text_align: center
              text: "ohne WP"
              text_font: montserrat_14_de
              text_color: 0x94A3B8
          - label:
              id: val_hauswp
              x: 253
              y: 144
              width: 112
              text_align: center
              text: "0.0 kW"
              text_font: montserrat_20_de
              text_color: 0xF8FAFC

          # ── Buzz arc ─────────────────────────────────────────
          - arc:
              id: arc_buzz
              x: 8
              y: 228
              width: 80
              height: 80
              value: 0
              min_value: 0
              max_value: 100
              arc_color: 0x1E293B
              arc_width: 12
              indicator:
                arc_color: 0xA78BFA
                arc_width: 12
          - label:
              id: val_buzz
              x: 8
              y: 252
              width: 80
              text_align: center
              text: "-- %"
              text_font: montserrat_14_de
              text_color: 0xF8FAFC
          - label:
              x: 8
              y: 268
              width: 80
              text_align: center
              text: "Buzz"
              text_font: montserrat_14_de
              text_color: 0x94A3B8

          # ── Wärmepumpe card ──────────────────────────────────
          - obj:
              x: 130
              y: 228
              width: 115
              height: 84
              radius: 10
              bg_color: 0x101A2C
              border_width: 1
              border_color: 0x22304A
              pad_all: 0
              scrollable: false
          - label:
              x: 130
              y: 238
              width: 115
              text_align: center
              text: "Wärmepumpe"
              text_font: montserrat_14_de
              text_color: 0xFB923C
          - label:
              id: val_wp
              x: 130
              y: 256
              width: 115
              text_align: center
              text: "0.0 kW"
              text_font: montserrat_20_de
              text_color: 0xF8FAFC
          - label:
              id: val_wp_zyklen
              x: 130
              y: 284
              width: 115
              text_align: center
              text: "-- Starts"
              text_font: montserrat_14_de
              text_color: 0x94A3B8

          # ── Warmwasser card ──────────────────────────────────
          - obj:
              x: 253
              y: 228
              width: 112
              height: 84
              radius: 10
              bg_color: 0x101A2C
              border_width: 1
              border_color: 0x22304A
              pad_all: 0
              scrollable: false
          - label:
              x: 253
              y: 238
              width: 112
              text_align: center
              text: "Warmwasser"
              text_font: montserrat_14_de
              text_color: 0xFB923C
          - label:
              id: val_wasser
              x: 253
              y: 256
              width: 112
              text_align: center
              text: "0.0 °C"
              text_font: montserrat_20_de
              text_color: 0xF8FAFC
          - label:
              id: val_wp_ruecklauf
              x: 253
              y: 284
              width: 112
              text_align: center
              text: "Rücklauf"
              text_font: montserrat_14_de
              text_color: 0x94A3B8

          # ── Wires ────────────────────────────────────────────
          # The direction of a flow is shown by the comets travelling along
          # the wire, so the wires themselves stay plain.
          - line:
              id: line_pv_akku
              points:
                - 48, 54
                - 48, 104
              line_color: 0x4A3A0C
              line_width: 2
              line_rounded: true
              hidden: true
          - line:
              id: line_pv_einspeisung
              points:
                - 102, 18
                - 128, 18
              line_color: 0x17452C
              line_width: 2
              line_rounded: true
              hidden: true
          - line:
              id: line_pv_haus
              points:
                - 96, 54
                - 147, 104
              line_color: 0x4A3A0C
              line_width: 2
              line_rounded: true
              hidden: true
          - line:
              id: line_netz_haus
              points:
                - 309, 54
                - 228, 104
              line_color: 0x4A2222
              line_width: 2
              line_rounded: true
              hidden: true
          - line:
              id: line_akku_haus
              points:
                - 92, 148
                - 126, 148
              line_color: 0x0B4152
              line_width: 2
              line_rounded: true
              hidden: true
          - line:
              id: line_haus_wp
              points:
                - 187, 186
                - 187, 224
              line_color: 0x4A2C11
              line_width: 2
              line_rounded: true
              hidden: true
          - line:
              id: line_haus_buzz
              points:
                - 150, 186
                - 88, 226
              line_color: 0x322A4D
              line_width: 2
              line_rounded: true
              hidden: true

          # ── Comets ───────────────────────────────────────────
          # Position and opacity come from the 50 ms interval; only the size
