# ─────────────────────────────────────────────────────────────────────────────
# Live panel — energy flow diagram
#
# Layout (panel local coordinates, 375 x 320):
#   y   4 …  52   three header tiles: PV | Einspeisung | Netzbezug
#   y 108 … 188   Akku arc | Haus node | "ohne WP" card
#   y 228 … 312   Buzz arc | Wärmepumpe card | Warmwasser card
#
# Every card follows the same three-part rhythm — icon, big value, caption —
# so the eye finds the number in the same place in every box. The two cards in
# the middle column additionally carry a 5 px bar that splits their value:
#   bar_autark    green vs red   — share of the house load not taken from grid
#   bar_haushalt  slate vs orange — share of the house load that is not the WP
#
# Every connection is built from two kinds of widgets:
#   line_<flow>     the wire, in a heavily dimmed version of the flow colour
#   arrow_<flow>_N  chevrons that travel along the wire and show the
#                   direction of the flow
#
# The sensors only normalise their value to kW and store it in a global.
# Visibility, wire width, arrow direction and arrow speed are derived centrally
# in the 50 ms interval below, so a flow is never inconsistent with the numbers
# next to it.
#
# Icon codepoints are looked up in the cached MaterialDesign webfont, never
# guessed — see CLAUDE.md. They are written as UTF-8 byte escapes inside
# lambdas (block scalars pass them straight to C++) and as \U escapes in the
# YAML strings that the font glyph list and the static labels use.
# ─────────────────────────────────────────────────────────────────────────────

globals:
  # Raw power values, all normalised to kW.
  - id: pv_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: export_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: import_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: batt_kw          # positive = charging, negative = discharging
    type: float
    restore_value: false
    initial_value: '0'
  - id: house_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: hauswp_kw        # house consumption without the heat pump
    type: float
    restore_value: false
    initial_value: '0'
  - id: wp_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: buzz_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: soc_pct          # battery state of charge, negative while unknown
    type: float
    restore_value: false
    initial_value: '-1'

script:
  # Battery icon, arc colour and caption depend on charge *and* state of
  # charge, so both sensors funnel through here instead of half-updating it.
  - id: refresh_akku
    then:
      - lambda: |-
          const float p = id(batt_kw);
          const float soc = id(soc_pct);
          const bool charging = p > 0.05f;
          const bool low = soc >= 0.0f && soc < 20.0f;
          const char *icon;
          if (charging)          icon = "\xF3\xB0\x82\x84";  // battery-charging
          else if (soc < 0.0f)   icon = "\xF3\xB0\x82\x8E";  // battery-outline
          else if (soc >= 66.0f) icon = "\xF3\xB1\x8A\xA3";  // battery-high
          else if (soc >= 33.0f) icon = "\xF3\xB1\x8A\xA2";  // battery-medium
          else                   icon = "\xF3\xB1\x8A\xA1";  // battery-low
          const uint32_t tint = charging ? 0x4ADE80 : (low ? 0xF87171 : 0x22D3EE);
          lv_label_set_text(id(icon_akku), icon);
          lv_obj_set_style_text_color(id(icon_akku), lv_color_hex(tint), LV_PART_MAIN);
          lv_obj_set_style_arc_color(id(arc_akku), lv_color_hex(low ? 0xF87171 : 0x22D3EE),
                                     LV_PART_INDICATOR);
          // Idle batteries say "Akku", moving ones say how fast. The direction
          // is already in the icon, so the number stays unsigned and narrow
          // enough to clear the ring.
          if (fabsf(p) < 0.05f) {
            lv_label_set_text(id(cap_akku), "Akku");
            lv_obj_set_style_text_color(id(cap_akku), lv_color_hex(0x94A3B8), LV_PART_MAIN);
          } else {
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f kW", fabsf(p));
            lv_label_set_text(id(cap_akku), buf);
            lv_obj_set_style_text_color(id(cap_akku), lv_color_hex(tint), LV_PART_MAIN);
          }

  # The two bars under the middle column, both shares of the house load.
  - id: refresh_bars
    then:
      - lvgl.bar.update:
          id: bar_autark
          value: !lambda |-
            const float h = id(house_kw);
            if (h <= 0.05f) return 100;
            const int v = (int) lroundf(100.0f * (h - id(import_kw)) / h);
            return v < 0 ? 0 : (v > 100 ? 100 : v);
      - lvgl.bar.update:
          id: bar_haushalt
          value: !lambda |-
            const float h = id(house_kw);
            if (h <= 0.05f) return 100;
            const int v = (int) lroundf(100.0f * id(hauswp_kw) / h);
            return v < 0 ? 0 : (v > 100 ? 100 : v);

sensor:
  - platform: homeassistant
    id: pv
    entity_id: sensor.solarnet_power_photovoltaics
    on_value:
      - lambda: |-
          id(pv_kw) = isnan(x) ? 0.0f : x / 1000.0f;
          lv_obj_set_style_text_color(id(icon_pv),
              lv_color_hex(id(pv_kw) > 0.05f ? 0xFBBF24 : 0x475569), LV_PART_MAIN);
      - lvgl.label.update:
          id: val_pv
          text:
            format: "%.1f kW"
            args: ['id(pv_kw)']

  - platform: homeassistant
    id: pv_eingespeist
    entity_id: sensor.solarnet_power_grid_export
    on_value:
      - lambda: |-
          id(export_kw) = isnan(x) ? 0.0f : x / 1000.0f;
          lv_obj_set_style_text_color(id(icon_export),
              lv_color_hex(id(export_kw) > 0.05f ? 0x4ADE80 : 0x475569), LV_PART_MAIN);
      - lvgl.label.update:
          id: val_eingespeist
          text:
            format: "%.1f kW"
            args: ['id(export_kw)']

  - platform: homeassistant
    id: netzbezug
    entity_id: sensor.solarnet_power_grid_import
    on_value:
      - lambda: |-
          id(import_kw) = isnan(x) ? 0.0f : x / 1000.0f;
          lv_obj_set_style_text_color(id(icon_grid),
              lv_color_hex(id(import_kw) > 0.05f ? 0xF87171 : 0x475569), LV_PART_MAIN);
      - lvgl.label.update:
          id: val_netz
          text:
            format: "%.1f kW"
            args: ['id(import_kw)']
      - script.execute: refresh_bars

  - platform: homeassistant
    id: batterie_ladeleistung
    entity_id: sensor.batterie_ladeleistung_entladeleistung
    on_value:
      - lambda: 'id(batt_kw) = isnan(x) ? 0.0f : x / 1000.0f;'
      - script.execute: refresh_akku

  - platform: homeassistant
    id: gesamt_stromverbrauch
    entity_id: sensor.gesamt_stromverbrauch_in_kwh
    on_value:
      - lambda: 'id(house_kw) = isnan(x) ? 0.0f : x;'
      - lvgl.label.update:
          id: val_gesamt
          text:
            format: "%.1f kW"
            args: ['id(house_kw)']
      - script.execute: refresh_bars

  - platform: homeassistant
    id: wp
    entity_id: sensor.strom_warmpumpe_in_kwh
    on_value:
      - lambda: |-
          id(wp_kw) = isnan(x) ? 0.0f : x;
          lv_obj_set_style_text_color(id(icon_wp),
              lv_color_hex(id(wp_kw) > 0.05f ? 0xFB923C : 0x475569), LV_PART_MAIN);
      - lvgl.label.update:
          id: val_wp
          text:
            format: "%.1f kW"
            args: ['id(wp_kw)']

  - platform: homeassistant
    id: wattpilot_charging_power
    entity_id: sensor.wattpilot_charging_power
    on_value:
      - lambda: |-
          id(buzz_kw) = isnan(x) ? 0.0f : x / 1000.0f;
          lv_obj_set_style_text_color(id(icon_buzz),
              lv_color_hex(id(buzz_kw) > 0.05f ? 0xA78BFA : 0x475569), LV_PART_MAIN);
      - lvgl.label.update:
          id: val_buzz
          text:
            format: "%.0f kW"
            args: ['id(buzz_kw)']
      - lvgl.arc.update:
          id: arc_buzz
          value: !lambda 'return (int) (id(buzz_kw) + 0.5f);'

  # ── Values that are only displayed ───────────────────────────
  - platform: homeassistant
    id: hausverbrauch_ohne_wp
    entity_id: sensor.hausverbrauch_ohne_wp
    on_value:
      - lambda: 'id(hauswp_kw) = isnan(x) ? 0.0f : x;'
      - lvgl.label.update:
          id: val_hauswp
          text:
            format: "%.1f kW"
            args: ['id(hauswp_kw)']
      - script.execute: refresh_bars

  - platform: homeassistant
    id: byd_battery_box_premium_hv_state_of_charge
    entity_id: sensor.byd_battery_box_premium_hv_state_of_charge
    on_value:
      - lambda: 'id(soc_pct) = isnan(x) ? -1.0f : x;'
      - if:
          condition:
            lambda: 'return id(soc_pct) >= 0.0f;'
          then:
            - lvgl.label.update:
                id: val_akku
                text:
                  format: "%.0f%%"
                  args: ['id(soc_pct)']
            - lvgl.arc.update:
                id: arc_akku
                value: !lambda 'return id(soc_pct);'
          else:
            - lvgl.label.update:
                id: val_akku
                text: "--%"
            - lvgl.arc.update:
                id: arc_akku
                value: 0
      - script.execute: refresh_akku

  - platform: homeassistant
    id: tagliche_wp_heizzyklen
    entity_id: sensor.tagliche_wp_heizzyklen
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: val_wp_zyklen
                text:
                  format: "%.0f Starts"
                  args: [x]

  - platform: homeassistant
    id: wp_ruecklauf
    entity_id: sensor.luxtronik_350107_0371_flow_out_temperature
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: val_wp_ruecklauf
                text:
                  format: "Rück %.1f °C"
                  args: [x]

  - platform: homeassistant
    id: ww_temperatur
    entity_id: sensor.hybrox_11_grail_dhw
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: val_wasser
                text:
                  format: "%.1f °C"
                  args: [x]

interval:
  # 20 fps animation of the energy flows.
  - interval: 50ms
    then:
      - lambda: |-
          // Split the raw meter readings into the seven directed flows (kW).
          const float batt_charge = std::max(0.0f, id(batt_kw));
          const float batt_supply = std::max(0.0f, -id(batt_kw));
          const float pv_direct = std::max(0.0f, id(pv_kw) - id(export_kw) - batt_charge);
          const float flow_kw[7] = {
            batt_charge,     // 0  PV -> Akku
            id(export_kw),   // 1  PV -> Einspeisung
            pv_direct,       // 2  PV -> Haus
            id(import_kw),   // 3  Netz -> Haus
            batt_supply,     // 4  Akku -> Haus
            id(wp_kw),       // 5  Haus -> Wärmepumpe
            id(buzz_kw),     // 6  Haus -> Buzz
          };
          // Start, end and the number of arrows on each path. The arrow count
          // keeps them roughly 25 px apart on every path.
          static const struct { int16_t x0, y0, x1, y1; uint8_t arrows; } PATH[7] = {
            { 48,  54,  48, 104, 2},
            {102,  28, 128,  28, 1},
            { 96,  54, 147, 104, 3},
            {309,  54, 228, 104, 4},
            { 92, 148, 126, 148, 1},
            {187, 190, 187, 224, 1},
            {150, 190,  88, 226, 3},
          };
          lv_obj_t *wire[7] = {
            id(line_pv_akku)->obj,
            id(line_pv_einspeisung)->obj,
            id(line_pv_haus)->obj,
            id(line_netz_haus)->obj,
            id(line_akku_haus)->obj,
            id(line_haus_wp)->obj,
            id(line_haus_buzz)->obj,
          };
          lv_obj_t *arrow[7][4] = {
            {id(arrow_pv_akku_0)->obj,   id(arrow_pv_akku_1)->obj},
            {id(arrow_pv_einsp_0)->obj},
            {id(arrow_pv_haus_0)->obj,   id(arrow_pv_haus_1)->obj,   id(arrow_pv_haus_2)->obj},
            {id(arrow_netz_haus_0)->obj, id(arrow_netz_haus_1)->obj, id(arrow_netz_haus_2)->obj, id(arrow_netz_haus_3)->obj},
            {id(arrow_akku_haus_0)->obj},
            {id(arrow_haus_wp_0)->obj},
            {id(arrow_haus_buzz_0)->obj, id(arrow_haus_buzz_1)->obj, id(arrow_haus_buzz_2)->obj},
          };
          const lv_style_selector_t sel = (lv_style_selector_t) LV_PART_MAIN | (lv_style_selector_t) LV_STATE_DEFAULT;
          // Animation position (0…1) of the arrows on each path, whether the
          // flow was running on the previous tick, and the wire width that is
          // currently applied.
          static float flow_phase[7] = {};
          static bool was_active[7] = {};
          static int last_width[7] = {};

          // The arrow shape: a three point chevron "›", swept back from the
          // tip and turned into the direction of its path. It is built once
          // from the very same PATH table that moves the arrows, so an arrow
          // can never point the wrong way down a wire. LVGL keeps the pointer
          // to the point array instead of copying it — hence "static", and
          // hence the placeholder points in the YAML below.
          static lv_point_precise_t arrow_pts[7][3];
          // The shift that moved the chevron into that box: added to a point
          // on the wire it gives the widget position that puts the arrow there.
          static float arrow_ofs_x[7], arrow_ofs_y[7];
          static bool arrows_built = false;
          if (!arrows_built) {
            arrows_built = true;
            const float COS_SWEEP = 0.766f;   // legs swept back by 40°
            const float SIN_SWEEP = 0.643f;
            const float LEG = 9.0f;           // length of one chevron leg
            const float TIP = 4.5f;           // tip ahead of the path position
            for (int f = 0; f < 7; f++) {
              const float dx = PATH[f].x1 - PATH[f].x0;
              const float dy = PATH[f].y1 - PATH[f].y0;
              const float len = sqrtf(dx * dx + dy * dy);
              const float ux = dx / len, uy = dy / len;
              const float tx = ux * TIP, ty = uy * TIP;
              // Tip in the middle, the two legs rotated by ±40° against the
              // direction of travel.
              const float px[3] = {tx - LEG * (ux * COS_SWEEP - uy * SIN_SWEEP), tx,
                                   tx - LEG * (ux * COS_SWEEP + uy * SIN_SWEEP)};
              const float py[3] = {ty - LEG * (ux * SIN_SWEEP + uy * COS_SWEEP), ty,
                                   ty - LEG * (uy * COS_SWEEP - ux * SIN_SWEEP)};
              // Line points are widget local and must not be negative, so the
              // chevron is shifted into its own box; the shift is the offset.
              const float minx = std::min(px[0], std::min(px[1], px[2]));
              const float miny = std::min(py[0], std::min(py[1], py[2]));
              for (int k = 0; k < 3; k++) {
                arrow_pts[f][k].x = (lv_value_precise_t) lroundf(px[k] - minx);
                arrow_pts[f][k].y = (lv_value_precise_t) lroundf(py[k] - miny);
              }
              arrow_ofs_x[f] = minx;
              arrow_ofs_y[f] = miny;
              for (int k = 0; k < PATH[f].arrows; k++)
                lv_line_set_points(arrow[f][k], arrow_pts[f], 3);
            }
          }

          for (int f = 0; f < 7; f++) {
            const bool active = flow_kw[f] > 0.05f;
            if (!active) {
              // Park wire and arrows once, when the flow stops.
              if (was_active[f]) {
                lv_obj_add_flag(wire[f], LV_OBJ_FLAG_HIDDEN);
                for (int k = 0; k < PATH[f].arrows; k++)
                  lv_obj_add_flag(arrow[f][k], LV_OBJ_FLAG_HIDDEN);
                was_active[f] = false;
              }
              continue;
            }
            if (!was_active[f]) {
              lv_obj_clear_flag(wire[f], LV_OBJ_FLAG_HIDDEN);
              was_active[f] = true;
            }

            // 2 px wire at idle, 4 px from 4 kW upwards.
            const int width = 2 + (int) (std::min(flow_kw[f], 4.0f) / 2.0f + 0.5f);
            if (width != last_width[f]) {
              lv_obj_set_style_line_width(wire[f], width, sel);
              last_width[f] = width;
            }

            const float dx = PATH[f].x1 - PATH[f].x0;
            const float dy = PATH[f].y1 - PATH[f].y0;
            const float len = sqrtf(dx * dx + dy * dy);
            // Arrows crawl at 16 px/s and speed up to ~86 px/s at 5 kW.
            const float speed = 16.0f + 14.0f * std::min(flow_kw[f], 5.0f);
            float phase = flow_phase[f] + speed * 0.05f / len;
            if (phase >= 1.0f)
              phase -= 1.0f;
            flow_phase[f] = phase;

            for (int k = 0; k < PATH[f].arrows; k++) {
              lv_obj_t *a = arrow[f][k];
              float t = phase + (float) k / PATH[f].arrows;
              if (t >= 1.0f)
                t -= 1.0f;
              lv_obj_set_pos(a, (int) (PATH[f].x0 + dx * t + arrow_ofs_x[f] + 0.5f),
                                (int) (PATH[f].y0 + dy * t + arrow_ofs_y[f] + 0.5f));
              // Fade in at the source and out again at the destination.
              const float fade = t < 0.12f ? t / 0.12f
                                           : (t > 0.85f ? (1.0f - t) / 0.15f : 1.0f);
              lv_obj_set_style_line_opa(a, (lv_opa_t) (255.0f * fade), sel);
              if (lv_obj_has_flag(a, LV_OBJ_FLAG_HIDDEN))
                lv_obj_clear_flag(a, LV_OBJ_FLAG_HIDDEN);
            }
          }

font:
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_20
    size: 20
    glyphs:
      - "\U000F0A72"  # solar-power
      - "\U000F192C"  # transmission-tower-export
      - "\U000F192D"  # transmission-tower-import
      - "\U000F1903"  # home-lightning-bolt
      - "\U000F1904"  # home-lightning-bolt-outline
      - "\U000F0084"  # battery-charging
      - "\U000F008E"  # battery-outline
      - "\U000F12A1"  # battery-low
      - "\U000F12A2"  # battery-medium
      - "\U000F12A3"  # battery-high
      - "\U000F0B6C"  # car-electric
      - "\U000F1A43"  # heat-pump
      - "\U000F0F92"  # water-boiler
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_14
    size: 14
    glyphs:
      - "\U000F0709"  # restart
      - "\U000F0E02"  # thermometer-chevron-down

lvgl:
  style_definitions:
    # Cards: one dark inset panel, tinted only by the border so the accent
    # colour of a box is stated once and never repeated per widget.
    - id: card
      bg_color: 0x101A2C
      bg_grad_color: 0x0C1322
      bg_grad_dir: VER
      radius: 10
      border_width: 1
      border_color: 0x22304A
      pad_all: 0
    - id: card_solar
      border_color: 0x3D3418
    - id: card_export
      border_color: 0x1B4030
    - id: card_grid
      border_color: 0x3F2222
    - id: card_heat
      border_color: 0x3D2B17

    # The three text roles every box is built from.
    - id: t_icon
      text_font: mdi_20
      text_align: center
    - id: t_icon_sm
      text_font: mdi_14
      text_align: center
    - id: t_value
      text_font: montserrat_20_de
      text_color: 0xF8FAFC
      text_align: center
    - id: t_caption
      text_font: montserrat_14_de
      text_color: 0x94A3B8
      text_align: center

    # Shared look of the arrows: the stroke of the chevron and one style per
    # flow colour, combined per widget via "styles:".
    - id: flow_arrow
      line_width: 3
      line_rounded: true
    - id: arrow_pv
      line_color: 0xFBBF24
    - id: arrow_export
      line_color: 0x4ADE80
    - id: arrow_grid
      line_color: 0xF87171
    - id: arrow_akku
      line_color: 0x22D3EE
    - id: arrow_wp
      line_color: 0xFB923C
    - id: arrow_buzz
      line_color: 0xA78BFA

  widgets:
    # ── TOP RIGHT: Live ──────────────────────────────────────
    - obj:
        x: 405
        y: 80
        width: 375
        height: 320
        bg_color: 0x151F32
        radius: 12
        border_width: 1
        border_color: 0x1E293B
        pad_all: 0
        scrollable: false
        widgets:
          # ── Header tiles ─────────────────────────────────────
          # The gap between the PV and the Einspeisung tile is wide on
          # purpose: the export arrow travels through it.
          - obj:
              x: 8
              y: 4
              width: 92
              height: 48
              styles: [card, card_solar]
              scrollable: false
          - obj:
              x: 130
              y: 4
              width: 114
              height: 48
              styles: [card, card_export]
              scrollable: false
          - obj:
              x: 254
              y: 4
              width: 111
              height: 48
              styles: [card, card_grid]
              scrollable: false

          - label:
              id: icon_pv
              x: 32
              y: 6
              text: "\U000F0A72"
              styles: [t_icon]
              text_color: 0xFBBF24
          - label:
              x: 56
              y: 8
              text: "PV"
              styles: [t_caption]
              text_color: 0xFBBF24
          - label:
              id: val_pv
              x: 8
              y: 26
              width: 92
              text: "0.0 kW"
              styles: [t_value]

          - label:
              id: icon_export
              x: 133
              y: 6
              text: "\U000F192C"
              styles: [t_icon]
              text_color: 0x4ADE80
          - label:
              x: 157
              y: 8
              text: "Einspeisung"
              styles: [t_caption]
              text_color: 0x4ADE80
          - label:
              id: val_eingespeist
              x: 130
              y: 26
              width: 114
              text: "0.0 kW"
              styles: [t_value]

          - label:
              id: icon_grid
              x: 260
              y: 6
              text: "\U000F192D"
              styles: [t_icon]
              text_color: 0xF87171
          - label:
              x: 284
              y: 8
              text: "Netzbezug"
              styles: [t_caption]
              text_color: 0xF87171
          - label:
              id: val_netz
              x: 254
