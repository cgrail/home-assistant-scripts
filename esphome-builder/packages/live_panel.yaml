# ─────────────────────────────────────────────────────────────────────────────
# Live panel — energy flow diagram with animated "electrons"
#
# Every connection is built from three kinds of widgets:
#   line_<flow>    the wire (dimmed colour, width scales with the power)
#   head_<flow>    the arrow head at the destination (bright colour)
#   dot_<flow>_N   glowing pulses that travel along the wire
#
# The sensors only normalise their value to kW and store it in a global.
# Visibility, wire width and pulse speed are derived centrally in the 50 ms
# interval below, so a flow is never inconsistent with the numbers next to it.
# ─────────────────────────────────────────────────────────────────────────────

globals:
  # Raw power values, all normalised to kW.
  - id: pv_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: export_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: import_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: batt_kw          # positive = charging, negative = discharging
    type: float
    restore_value: false
    initial_value: '0'
  - id: house_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: wp_kw
    type: float
    restore_value: false
    initial_value: '0'
  - id: buzz_kw
    type: float
    restore_value: false
    initial_value: '0'

sensor:
  - platform: homeassistant
    id: pv
    entity_id: sensor.solarnet_power_photovoltaics
    on_value:
      - lambda: 'id(pv_kw) = isnan(x) ? 0.0f : x / 1000.0f;'
      - lvgl.label.update:
          id: val_pv
          text:
            format: "%.1f kW"
            args: ['id(pv_kw)']

  - platform: homeassistant
    id: pv_eingespeist
    entity_id: sensor.solarnet_power_grid_export
    on_value:
      - lambda: 'id(export_kw) = isnan(x) ? 0.0f : x / 1000.0f;'
      - lvgl.label.update:
          id: val_eingespeist
          text:
            format: "%.1f kW"
            args: ['id(export_kw)']

  - platform: homeassistant
    id: netzbezug
    entity_id: sensor.solarnet_power_grid_import
    on_value:
      - lambda: 'id(import_kw) = isnan(x) ? 0.0f : x / 1000.0f;'
      - lvgl.label.update:
          id: val_netz
          text:
            format: "%.1f kW"
            args: ['id(import_kw)']

  - platform: homeassistant
    id: batterie_ladeleistung
    entity_id: sensor.batterie_ladeleistung_entladeleistung
    on_value:
      - lambda: 'id(batt_kw) = isnan(x) ? 0.0f : x / 1000.0f;'

  - platform: homeassistant
    id: gesamt_stromverbrauch
    entity_id: sensor.gesamt_stromverbrauch_in_kwh
    on_value:
      - lambda: 'id(house_kw) = isnan(x) ? 0.0f : x;'
      - lvgl.label.update:
          id: val_gesamt
          text:
            format: "%.1f kW"
            args: ['id(house_kw)']

  - platform: homeassistant
    id: wp
    entity_id: sensor.strom_warmpumpe_in_kwh
    on_value:
      - lambda: 'id(wp_kw) = isnan(x) ? 0.0f : x;'
      - lvgl.label.update:
          id: val_wp
          text:
            format: "%.1f kW"
            args: ['id(wp_kw)']

  - platform: homeassistant
    id: wattpilot_charging_power
    entity_id: sensor.wattpilot_charging_power
    on_value:
      - lambda: 'id(buzz_kw) = isnan(x) ? 0.0f : x / 1000.0f;'

  # ── Values that are only displayed ───────────────────────────
  - platform: homeassistant
    id: hausverbrauch_ohne_wp
    entity_id: sensor.hausverbrauch_ohne_wp
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: val_hauswp
                text:
                  format: "%.1f kW"
                  args: [x]

  - platform: homeassistant
    id: byd_battery_box_premium_hv_state_of_charge
    entity_id: sensor.byd_battery_box_premium_hv_state_of_charge
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: val_akku
                text:
                  format: "%.0f%%"
                  args: [x]
            - lvgl.arc.update:
                id: arc_akku
                value: !lambda 'return x;'
          else:
            - lvgl.label.update:
                id: val_akku
                text: "-- %"
            - lvgl.arc.update:
                id: arc_akku
                value: 0

  - platform: homeassistant
    id: buzz_battery_level
    entity_id: sensor.buzz_battery_level
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: val_buzz
                text:
                  format: "%.0f%%"
                  args: [x]
            - lvgl.arc.update:
                id: arc_buzz
                value: !lambda 'return x;'
          else:
            - lvgl.label.update:
                id: val_buzz
                text: "-- %"
            - lvgl.arc.update:
                id: arc_buzz
                value: 0

  - platform: homeassistant
    id: tagliche_wp_heizzyklen
    entity_id: sensor.tagliche_wp_heizzyklen
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: val_wp_zyklen
                text:
                  format: "Heute: %.0f Starts"
                  args: [x]

  - platform: homeassistant
    id: wp_ruecklauf
    entity_id: sensor.luxtronik_350107_0371_flow_out_temperature
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: val_wp_ruecklauf
                text:
                  format: "Rück: %.1f °C"
                  args: [x]

  - platform: homeassistant
    id: ww_temperatur
    entity_id: sensor.hybrox_11_grail_dhw
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: val_wasser
                text:
                  format: "%.1f °C"
                  args: [x]

interval:
  # 20 fps animation of the energy flows.
  - interval: 50ms
    then:
      - lambda: |-
          // Split the raw meter readings into the seven directed flows (kW).
          const float batt_charge = std::max(0.0f, id(batt_kw));
          const float batt_supply = std::max(0.0f, -id(batt_kw));
          const float pv_direct = std::max(0.0f, id(pv_kw) - id(export_kw) - batt_charge);
          const float flow_kw[7] = {
            batt_charge,     // 0  PV -> Akku
            id(export_kw),   // 1  PV -> Einspeisung
            pv_direct,       // 2  PV -> Haus
            id(import_kw),   // 3  Netz -> Haus
            batt_supply,     // 4  Akku -> Haus
            id(wp_kw),       // 5  Haus -> Wärmepumpe
            id(buzz_kw),     // 6  Haus -> Buzz
          };
          // Start point, arrow tip and number of pulses of each wire.
          static const struct { int16_t x0, y0, x1, y1; uint8_t pulses; } PATH[7] = {
            { 50,  55,  50, 110, 3},
            { 88,  20, 128,  20, 2},
            { 88,  55, 154, 102, 3},
            {292,  55, 199, 100, 4},
            { 90, 155, 115, 155, 2},
            {177, 186, 177, 233, 2},
            {120, 186,  90, 235, 3},
          };
          lv_obj_t *wire[7] = {
            id(line_pv_akku)->obj,
            id(line_pv_einspeisung)->obj,
            id(line_pv_haus)->obj,
            id(line_netz_haus)->obj,
            id(line_akku_haus)->obj,
            id(line_haus_wp)->obj,
            id(line_haus_buzz)->obj,
          };
          lv_obj_t *head[7] = {
            id(head_pv_akku)->obj,
            id(head_pv_einspeisung)->obj,
            id(head_pv_haus)->obj,
            id(head_netz_haus)->obj,
            id(head_akku_haus)->obj,
            id(head_haus_wp)->obj,
            id(head_haus_buzz)->obj,
          };
          lv_obj_t *pulse[7][4] = {
            {id(dot_pv_akku_0),   id(dot_pv_akku_1),   id(dot_pv_akku_2),   nullptr},
            {id(dot_pv_einsp_0),  id(dot_pv_einsp_1),  nullptr,             nullptr},
            {id(dot_pv_haus_0),   id(dot_pv_haus_1),   id(dot_pv_haus_2),   nullptr},
            {id(dot_netz_haus_0), id(dot_netz_haus_1), id(dot_netz_haus_2), id(dot_netz_haus_3)},
            {id(dot_akku_haus_0), id(dot_akku_haus_1), nullptr,             nullptr},
            {id(dot_haus_wp_0),   id(dot_haus_wp_1),   nullptr,             nullptr},
            {id(dot_haus_buzz_0), id(dot_haus_buzz_1), id(dot_haus_buzz_2), nullptr},
          };
          const lv_style_selector_t sel = (lv_style_selector_t) LV_PART_MAIN | (lv_style_selector_t) LV_STATE_DEFAULT;
          // Animation position (0…1) of the pulses on each wire, and the wire
          // width that is currently applied.
          static float flow_phase[7] = {};
          static int last_width[7] = {};

          for (int f = 0; f < 7; f++) {
            const bool active = flow_kw[f] > 0.05f;
            // Only touch the hidden flag when the state actually changes.
            if (active == lv_obj_has_flag(wire[f], LV_OBJ_FLAG_HIDDEN)) {
              if (active) {
                lv_obj_clear_flag(wire[f], LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(head[f], LV_OBJ_FLAG_HIDDEN);
              } else {
                lv_obj_add_flag(wire[f], LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(head[f], LV_OBJ_FLAG_HIDDEN);
                for (int i = 0; i < PATH[f].pulses; i++)
                  lv_obj_add_flag(pulse[f][i], LV_OBJ_FLAG_HIDDEN);
              }
            }
            if (!active)
              continue;

            // 2 px wire at idle, 6 px from 4 kW upwards.
            const int width = 2 + (int) (std::min(flow_kw[f], 4.0f) + 0.5f);
            if (width != last_width[f]) {
              lv_obj_set_style_line_width(wire[f], width, sel);
              last_width[f] = width;
            }

            const float dx = PATH[f].x1 - PATH[f].x0;
            const float dy = PATH[f].y1 - PATH[f].y0;
            const float len = sqrtf(dx * dx + dy * dy);
            // Pulses crawl at 18 px/s and speed up to ~88 px/s at 5 kW.
            const float speed = 18.0f + 14.0f * std::min(flow_kw[f], 5.0f);
            float phase = flow_phase[f] + speed * 0.05f / len;
            if (phase >= 1.0f)
              phase -= 1.0f;
            flow_phase[f] = phase;

            for (int i = 0; i < PATH[f].pulses; i++) {
              lv_obj_t *p = pulse[f][i];
              float t = phase + (float) i / PATH[f].pulses;
              if (t >= 1.0f)
                t -= 1.0f;
              lv_obj_set_pos(p, (int) (PATH[f].x0 + dx * t + 0.5f) - 5,
                                (int) (PATH[f].y0 + dy * t + 0.5f) - 5);
              // Fade in at the source and out again at the arrow head.
              const float fade = t < 0.2f ? t / 0.2f : (t > 0.8f ? (1.0f - t) / 0.2f : 1.0f);
              lv_obj_set_style_bg_opa(p, (lv_opa_t) (255.0f * fade), sel);
              lv_obj_set_style_shadow_opa(p, (lv_opa_t) (150.0f * fade), sel);
              if (lv_obj_has_flag(p, LV_OBJ_FLAG_HIDDEN))
                lv_obj_clear_flag(p, LV_OBJ_FLAG_HIDDEN);
            }
          }

font:
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_14
    size: 14
    glyphs:
      - "\U000F0599"  # weather-sunny

