          # ── House ────────────────────────────────────────────
          - obj:
              x: 120
              y: 120
              width: 115
              height: 60
              radius: 0
              border_width: 0
              bg_color: 0x1E3A5F
          - line:
              points:
                - 115, 125
                - 177, 88
