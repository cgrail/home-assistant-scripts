    - obj: { id: xmas_bulb_19, x: 776, y: 4, width: 8, height: 8, radius: 4, bg_color: 0x00F000, border_width: 0, pad_all: 0, scrollable: false, shadow_width: 10, shadow_color: 0x00F000, shadow_opa: 80% }

    # ── Countdown ──────────────────────────────────────────────────────────────
    # In the free strip above the date, left-aligned with it. The longest text,
    # "Noch 38 Tage bis Heiligabend", is 208 px at 14 px and ends at x=392.
    - label:
        x: 160
        y: 12
        text: "\U000F0405"
        text_font: mdi_xmas
        text_color: 0x00F000
    - label:
        id: xmas_countdown
        x: 184
        y: 16
        text: ""
        text_font: montserrat_14_de
        text_color: 0xFFF4E0

    # ── Snow ───────────────────────────────────────────────────────────────────
    # Right of the countdown and above the weather text, which is right-aligned
    # to x=575 on the line below. Uneven on purpose: four flakes in a row at one
    # height and one brightness read as a divider, not as snow.
    - label: { x: 408, y: 18, text: "\U000F0717", text_font: mdi_xmas, text_color: 0xFFF4E0, text_opa: 70% }
    - label: { x: 452, y: 13, text: "\U000F0F2A", text_font: mdi_xmas, text_color: 0xFFF4E0, text_opa: 40% }
    - label: { x: 500, y: 20, text: "\U000F0717", text_font: mdi_xmas, text_color: 0xFFF4E0, text_opa: 55% }
    - label: { x: 542, y: 14, text: "\U000F0F2A", text_font: mdi_xmas, text_color: 0xFFF4E0, text_opa: 85% }
