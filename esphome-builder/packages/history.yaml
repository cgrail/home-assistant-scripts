          - obj:  { id: hist_eigen_4,  x: 146, y: 195, width: 22, height: 1, bg_color: 0x4ADE80, border_width: 0, radius: 2, pad_all: 0, scrollable: false, hidden: true }
          - obj:  { id: hist_netz_4,   x: 146, y: 194, width: 22, height: 1, bg_color: 0xF87171, border_width: 0, radius: 2, pad_all: 0, scrollable: false, hidden: true }
          - obj:  { id: hist_eigen_5,  x: 173, y: 195, width: 22, height: 1, bg_color: 0x4ADE80, border_width: 0, radius: 2, pad_all: 0, scrollable: false, hidden: true }
          - obj:  { id: hist_netz_5,   x: 173, y: 194, width: 22, height: 1, bg_color: 0xF87171, border_width: 0, radius: 2, pad_all: 0, scrollable: false, hidden: true }
