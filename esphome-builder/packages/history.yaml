          # gutter to the card's own right margin. A step brighter than the two
          # hairline rules (0x1E293B), which disappear against the card at this
          # width — a gridline nobody can follow across to the bar is not worth
          # the pixel. They are declared *before* the bars so a bar covers them.
          # y, text and visibility come from refresh_history_chart — the values
          # here are placeholders.
          - obj:   { id: hist_grid_0, x: 36, y: 195, width: 327, height: 1, bg_color: 0x334155, border_width: 0, radius: 0, pad_all: 0, scrollable: false, hidden: true }
