          # ── Chart header ─────────────────────────────────────
          # The two percentages are green because green is what they measure:
          # they double as the legend for the lower half of every bar. They are
          # read from across the room, so they get 14 px; the two words that
          # only label them stay at 12 px, dropped 2 px onto the same baseline.
          - label:
              x: 12
              y: 116
              text: "12 MONATE"
              styles: [t_caption_sm]
              text_align: left
          - label:
              x: 114
              y: 116
              text: "Autark"
              styles: [t_caption_sm]
              text_align: left
              text_color: 0x64748B
          # Both boxes are sized for "100 %" plus a few pixels of slack, not for
          # a typical value: the digits are proportional, so "88" is wider than
          # "71", and a box cut to today's number wraps onto a second line on
          # some other day. "Monat 100 %" does happen in a good summer month.
          - label:
