          - obj:   { id: hist_grid_3, x: 36, y: 195, width: 327, height: 1, bg_color: 0x334155, border_width: 0, radius: 0, pad_all: 0, scrollable: false, hidden: true }
          # Right-aligned into the 20 px gutter: "0.5" is 18 px at 12 px, and
          # aligning right keeps the decimal points under each other.
          - label: { id: hist_axis_0, x: 12, y: 190, width: 20, text: "", styles: [t_caption_sm], text_align: right, text_color: 0x64748B, hidden: true }
