http_request:
  timeout: 10s
  watchdog_timeout: 30s

image:
  - platform: online_image
    id: img_trmnl_trains
    # format=png, not jpeg: the endpoint emits *progressive* JPEG, which
    # ESPHome's JPEGDEC decoder cannot read (baseline only). The PNG is
    # 1-bit greyscale and ~1 KB, so it is the cheaper download anyway.
    url: "http://ha.grails.de:10000/dashboard-trmnl?viewport=400x120&format=png&crop_x=0&crop_y=60&crop_width=400&crop_height=120&theme=Catppuccin+Mocha&lang=de&dithering=&dither_method=none&palette=bw&no_normalize=&compression_level=1"
    format: PNG
    type: RGB565
    # must match the display's byte order, which mipi_rgb defaults to big endian
    byte_order: BIG_ENDIAN
    resize: 375x90
    update_interval: 5min
    on_download_finished:
      # Re-set src, don't just redraw: LVGL reads w/h out of the image
      # descriptor in lv_image_set_src(), and at boot the online image is
      # still empty (0x0, data == nullptr), so the widget latched a zero
      # size. Re-setting src makes it re-read the header.
      - lvgl.image.update:
          id: trains_img
          src: img_trmnl_trains
    on_error:
      - logger.log: "TRMNL train dashboard download failed"

text_sensor:
  - platform: homeassistant
    id: zuzenhausen_departures_raw
    entity_id: sensor.zuzenhausen_abfahrten_esphome
    on_value:
      - lambda: |-
          auto json_get = [](const std::string& s, const std::string& key, int nth) -> std::string {
            std::string needle = "\"" + key + "\"";
            size_t pos = 0;
            for (int i = 0; i <= nth; i++) {
              pos = s.find(needle, pos);
              if (pos == std::string::npos) return "--";
              if (i < nth) pos += needle.size();
            }
            pos = s.find(':', pos + needle.size());
            if (pos == std::string::npos) return "--";
            pos++;
            while (pos < s.size() && s[pos] == ' ') pos++;
            if (pos >= s.size()) return "--";
            if (s[pos] == '"') {
              pos++;
              size_t end = s.find('"', pos);
              return (end == std::string::npos) ? "--" : s.substr(pos, end - pos);
            }
            size_t end = s.find_first_of(",]}", pos);
            std::string val = (end == std::string::npos) ? s.substr(pos) : s.substr(pos, end - pos);
            while (!val.empty() && val.back() == ' ') val.pop_back();
            return val;
          };
          std::string d1_raw_delay = json_get(x, "delay", 0);
          int d1_delay_min         = (d1_raw_delay == "--") ? 0 : static_cast<int>(atof(d1_raw_delay.c_str()));
          if (d1_delay_min > 9) {
            char dbuf[20];
            snprintf(dbuf, sizeof(dbuf), "Zug +%d min", d1_delay_min);
            lv_label_set_text(id(overlay_delay_label), dbuf);
            lv_obj_clear_flag(id(overlay_zug_verspaetet), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(overlay_zug_verspaetet), LV_OBJ_FLAG_HIDDEN);
          }

lvgl:
  widgets:
    # ── TOP LEFT: ZUG ABFAHRTEN ─────────────────────────────────────────────────
    - obj:
        x: 20
        y: 80
        width: 375
        height: 90
        bg_color: 0x151F32
        radius: 12
        border_width: 1
        border_color: 0x1E293B
        pad_all: 0
        scrollable: false
        widgets:
          - image:
              id: trains_img
              x: 0
              y: 0
              src: img_trmnl_trains
